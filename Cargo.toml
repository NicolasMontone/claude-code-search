[package]
name = "claude-code-search"
version = "0.1.0"
edition = "2024"
description = "ccs: fuzzy-find and resume Claude Code sessions across every project"
license = "MIT"

[[bin]]
name = "ccs"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
strip = true

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
nucleo-matcher = "0.3.1"
ratatui = "0.30.2"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
