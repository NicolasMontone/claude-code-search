<!doctype html>
<html><head><meta charset="utf-8"><style>
  html,body{margin:0;width:1920px;height:1080px;background:#1e1e2e;color:#cdd6f4;overflow:hidden}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:"Geist",system-ui,sans-serif;
       background:radial-gradient(1440px 720px at 50% 40%,#2a2438 0%,#1e1e2e 60%)}
  .name{font-family:"Geist Mono",ui-monospace,monospace;font-size:144px;font-weight:600;letter-spacing:-5px}
  .name span{color:#d97757}
  .feats{margin-top:43px;display:flex;gap:22px}
  .feat{font-size:36px;color:#bac2de;padding:17px 29px;border:1px solid #45475a;border-radius:1199px;background:#181825}
  .install{margin-top:77px;font-family:"Geist Mono",ui-monospace,monospace;font-size:41px;color:#a6adc8;
           padding:31px 43px;border-radius:17px;background:#11111b;border:1px solid #313244}
  .install i{font-style:normal;color:#d97757;margin-right:22px}
</style></head><body>
  <div class="name"><span>❯</span> ccs</div>
  <div class="feats">
    <div class="feat">searches every prompt</div>
    <div class="feat">ranked by last used</div>
    <div class="feat">resumes in the right dir</div>
  </div>
  <div class="install"><i>$</i>cargo install --path .</div>
</body></html>
